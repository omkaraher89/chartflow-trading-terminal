name: Import source snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source snapshot
        run: curl -fsSL -o /tmp/source.tar.gz "https://chartflow-trading-terminal-jil8me-preview.freebuff.site/source.tar.gz"
      - name: Extract into the repository
        run: tar -xzf /tmp/source.tar.gz -C .
      - name: Commit and push
        run: |
          git config user.name "ChartFlow source import"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import"
            exit 0
          fi
          git commit -m "Add app source: components, engines, market client, lockfile"
          git push
